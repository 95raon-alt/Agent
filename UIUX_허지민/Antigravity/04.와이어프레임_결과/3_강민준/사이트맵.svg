<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1A1A1A; }
      .title { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-weight: bold; font-size: 24px; fill: #00FF66; }
      .subtitle { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 14px; fill: #CCCCCC; }
      .node-root { fill: #00FF66; stroke: #00CC52; stroke-width: 2; rx: 10px; ry: 10px; }
      .node-root-text { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-weight: bold; font-size: 16px; fill: #1A1A1A; text-anchor: middle; }
      .node-page { fill: #2A2A2A; stroke: #00FF66; stroke-width: 2; rx: 8px; ry: 8px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); }
      .node-page-title { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-weight: bold; font-size: 14px; fill: #00FF66; text-anchor: middle; }
      .node-page-sub { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #AAAAAA; text-anchor: middle; }
      .node-sub { fill: #113322; stroke: #00FF66; stroke-width: 1.5; rx: 6px; ry: 6px; }
      .node-sub-text { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-weight: 500; font-size: 12px; fill: #00FF66; text-anchor: middle; }
      .node-err { fill: #331111; stroke: #FF4444; stroke-width: 1.5; stroke-dasharray: 4; rx: 6px; ry: 6px; }
      .node-err-text { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #FF6666; text-anchor: middle; }
      .line { stroke: #00FF66; stroke-width: 2; fill: none; }
      .line-dash { stroke: #FF4444; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
      .arrow { fill: #00FF66; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Header -->
  <text x="50" y="45" class="title">🗺️ A:FIT Pro (강민준 디렉터) 3차 가상 클라이언트 계층형 사이트맵</text>
  <text x="50" y="70" class="subtitle">2040 피트니스 &amp; 바디 퍼포먼스 당류 0g 올인원 정기구독 서비스 (3-Depth 구조)</text>

  <!-- Root Node (PAGE-01) -->
  <g transform="translate(375, 110)">
    <rect width="250" height="60" class="node-root"/>
    <text x="125" y="30" class="node-root-text">PAGE-01 메인 랜딩페이지</text>
    <text x="125" y="48" font-family="'Pretendard', sans-serif" font-size="11" fill="#113322" text-anchor="middle">(당류 0g 차트 / 10초 원터치 / 종목 큐레이션)</text>
  </g>

  <!-- Connections from Root -->
  <path d="M 500,170 L 500,210 L 140,210 L 140,250" class="line" marker-end="url(#arrow)"/>
  <path d="M 500,170 L 500,210 L 380,210 L 380,250" class="line" marker-end="url(#arrow)"/>
  <path d="M 500,170 L 500,210 L 620,210 L 620,250" class="line" marker-end="url(#arrow)"/>
  <path d="M 500,170 L 500,210 L 860,210 L 860,250" class="line" marker-end="url(#arrow)"/>

  <!-- Depth 2 Nodes -->
  <!-- PAGE-02 -->
  <g transform="translate(50, 250)">
    <rect width="180" height="50" class="node-page"/>
    <text x="90" y="28" class="node-page-title">PAGE-02 브랜드 스토리</text>
    <text x="90" y="42" class="node-page-sub">스포츠 음료 당류 과다 / 특허 기술</text>
  </g>

  <!-- PAGE-03 -->
  <g transform="translate(290, 250)">
    <rect width="180" height="50" class="node-page"/>
    <text x="90" y="28" class="node-page-title">PAGE-03 AI 종목 큐레이션</text>
    <text x="90" y="42" class="node-page-sub">3단계 종목 퀴즈 / 맞춤 부스터</text>
  </g>

  <!-- PAGE-04 -->
  <g transform="translate(530, 250)">
    <rect width="180" height="50" class="node-page"/>
    <text x="90" y="28" class="node-page-title">PAGE-04 성분 &amp; 칼로리 비교</text>
    <text x="90" y="42" class="node-page-sub">시중 음료 칼로리 비교 / 구독 플랜</text>
  </g>

  <!-- PAGE-05 -->
  <g transform="translate(770, 250)">
    <rect width="180" height="50" class="node-page"/>
    <text x="90" y="28" class="node-page-title">PAGE-05 구독 결제 창</text>
    <text x="90" y="42" class="node-page-sub">배송 주기 선택 / 1초 간편 결제</text>
  </g>

  <!-- Connections from Depth 2 to Checkout -->
  <path d="M 380,300 L 380,350 L 860,350 L 860,300" class="line"/>
  <path d="M 620,300 L 620,350 L 860,350" class="line"/>
  <path d="M 860,300 L 860,400" class="line" marker-end="url(#arrow)"/>

  <!-- Depth 3 Nodes -->
  <!-- PAGE-06 -->
  <g transform="translate(770, 400)">
    <rect width="180" height="50" class="node-sub"/>
    <text x="90" y="28" class="node-sub-text">PAGE-06 구독 완료</text>
    <text x="90" y="42" font-family="'Pretendard', sans-serif" font-size="10" fill="#00FF66" text-anchor="middle">첫 배송 타임라인 / 알림톡</text>
  </g>

  <!-- Error Connection & Node -->
  <path d="M 860,300 L 860,350 L 620,350 L 620,400" class="line-dash"/>

  <!-- PAGE-07 -->
  <g transform="translate(530, 400)">
    <rect width="180" height="50" class="node-err"/>
    <text x="90" y="28" class="node-err-text">PAGE-07 오류/예외 모달</text>
    <text x="90" y="42" font-family="'Pretendard', sans-serif" font-size="10" fill="#FF6666" text-anchor="middle">결제 실패 / 필수입력 누락</text>
  </g>

  <!-- PAGE-08 -->
  <g transform="translate(290, 400)">
    <rect width="180" height="50" class="node-err"/>
    <text x="90" y="28" class="node-err-text">PAGE-08 404 안내 페이지</text>
    <text x="90" y="42" font-family="'Pretendard', sans-serif" font-size="10" fill="#FF6666" text-anchor="middle">잘못된 경로 진입 방어</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(50, 560)">
    <rect width="900" height="90" fill="#222222" stroke="#00FF66" stroke-width="1" rx="8" ry="8"/>
    <text x="20" y="30" font-family="'Pretendard', sans-serif" font-weight="bold" font-size="13" fill="#00FF66">범례 (Legend)</text>
    <rect x="20" y="45" width="20" height="15" class="node-root" rx="3" ry="3"/>
    <text x="50" y="57" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">메인 화면 (1Depth)</text>

    <rect x="220" y="45" width="20" height="15" class="node-page" rx="3" ry="3"/>
    <text x="250" y="57" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">주요 서브 화면 (2/3Depth)</text>

    <rect x="440" y="45" width="20" height="15" class="node-sub" rx="3" ry="3"/>
    <text x="470" y="57" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">완료/결과 화면</text>

    <rect x="640" y="45" width="20" height="15" class="node-err" rx="3" ry="3"/>
    <text x="670" y="57" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">예외/오류 처리 화면</text>
  </g>
</svg>
